name: Build production Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "js/**/*.js"
      - "tailwind.config.js"
      - "css/tailwind.input.css"
      - ".github/workflows/tailwind-build.yml"

concurrency:
  group: tailwind-production-css
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate shared JavaScript
        run: node --check js/site.js && node --check js/i18n.js
      - name: Compile production CSS
        run: npx --yes tailwindcss@3.4.17 --config tailwind.config.js --input css/tailwind.input.css --output css/tailwind.generated.css --minify
      - name: Commit generated stylesheet
        id: commit_css
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/tailwind.generated.css
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Production CSS is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Build production Tailwind stylesheet"
            git push
          fi
      - name: Request GitHub Pages rebuild
        if: steps.commit_css.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.request("POST /repos/{owner}/{repo}/pages/builds", {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
