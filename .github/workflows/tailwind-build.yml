name: Build production Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "js/**/*.js"
      - "tailwind.config.js"
      - "css/tailwind.input.css"
      - ".github/workflows/tailwind-build.yml"

permissions:
  contents: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile production CSS
        run: npx --yes tailwindcss@3.4.17 --config tailwind.config.js --input css/tailwind.input.css --output css/tailwind.generated.css --minify
      - name: Commit generated stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/tailwind.generated.css
          if git diff --cached --quiet; then
            echo "Production CSS is already up to date."
          else
            git commit -m "Build production Tailwind stylesheet"
            git push
          fi
